description: "Small first-pass grid to check whether DDPO-LoRA reward improves before scaling."
base_config: /scratch2/james2602/TextAwareIR/TAIRL/configs/ddpo_lora.yaml
shared:
  data.max_samples: 10000
  train.train_steps: 50
  train.batch_size: 1
  sample.steps: 8
  reward.variant: final_reward_norm
  reward.miss_penalty: 1.0
  reward.false_positive_penalty: 0.25
trials:
  - name: r4_lr1e-5_clip0.1_kl0.02
    overrides:
      lora.rank: 4
      lora.alpha: 4
      train.learning_rate: 1.0e-5
      ddpo.clip_range: 0.1
      ddpo.kl_coef: 0.02
  - name: r4_lr3e-5_clip0.1_kl0.02
    overrides:
      lora.rank: 4
      lora.alpha: 4
      train.learning_rate: 3.0e-5
      ddpo.clip_range: 0.1
      ddpo.kl_coef: 0.02
